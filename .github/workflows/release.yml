name: Release

# A maintainer signs and pushes a tag named v<version>. This workflow checks the tag and
# publishes the GitHub release; it never creates or signs a tag itself.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the signed tag and the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the main branch, whose checker and release keys are the reviewed ones
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the tag object itself
        # A plain fetch can leave a lightweight copy of the tag; the signature is on the tag object.
        run: git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check the signature, version, branch and changelog entry
        run: python tools/release_check.py tag --tag "$TAG" --main-ref "origin/${DEFAULT_BRANCH}" --notes-out release-notes.md
      - name: Run the checks on the tagged commit
        run: |
          git switch --detach "refs/tags/${TAG}^{commit}"
          make check PYTHON=python
      - name: Pass the release notes to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Requires a maintainer's approval when the environment is configured to ask for it.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Receive the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Publish the release for the existing tag
        run: |
          flags=(--verify-tag --title "Badge Buddy ${TAG#v}" --notes-file release-notes.md)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}"
      - name: Confirm the release is immutable
        # Immutable releases are a repository setting. With it on, the tag cannot be moved or deleted.
        run: |
          if [ "$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq .immutable)" != "true" ]; then
            echo "::error::The release was published, but immutable releases are not enabled for this repository."
            exit 1
          fi
