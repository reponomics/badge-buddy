name: Dependency scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan the MCP server's resolved dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Resolve what a user installing today would receive
        # uvx resolves the pinned server's dependencies at install time, so the scan
        # covers a fresh resolution and runs weekly as well as on changes.
        run: |
          mkdir -p build
          uv pip compile requirements-mcp.txt --python-version 3.11 --output-file build/requirements.txt
      - name: Scan the resolved versions for known vulnerabilities
        # A scanner error remains a job failure; it is not treated as an empty result.
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=build/requirements.txt
            --no-resolve
            --format=sarif
            --output-file=osv-scanner.sarif
      - name: Retain the scan and its input
        if: ${{ !cancelled() && hashFiles('osv-scanner.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-dependency-report
          path: |
            osv-scanner.sarif
            build/requirements.txt
          retention-days: 14
      - name: Upload results to code scanning
        if: ${{ !cancelled() && hashFiles('osv-scanner.sarif') != '' && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: osv-scanner.sarif
          category: resolved-mcp-dependencies
